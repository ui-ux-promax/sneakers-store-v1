name: db-seed-preview

# Применить схему + ЗАСИДИТЬ preview-ветку Neon (напр. preview/feat/phase2.2d-catalog-db) с Ubuntu-раннера
# (близко к Neon, без флака Windows→Neon / P1017 — локально гонять сид бесполезно, он зависает).
#
# ВНИМАНИЕ: сид делает TRUNCATE ... CASCADE по Product/Colorway/Variant/Image/Cart/CartItem.
# Поэтому НЕ переиспользуем db-push.yml и НЕ берём общие POSTGRES_URL-секреты (они у CI/прод).
# Строки берём из ОТДЕЛЬНЫХ секретов PREVIEW_POSTGRES_URL / PREVIEW_POSTGRES_URL_NON_POOLING,
# которые должны указывать на preview-ветку. Дополнительно — обязательное подтверждение вводом.
#
# Запуск: вкладка Actions → «db-seed-preview» → Run workflow → в поле confirm впиши: seed-preview
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Впиши "seed-preview" — подтверждение, что цель именно preview-БД (сид делает TRUNCATE).'
        required: true
        default: ''

defaults:
  run:
    working-directory: stride-app

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # ОТДЕЛЬНЫЕ preview-секреты — НЕ общие POSTGRES_URL (чтобы TRUNCATE не попал в прод/CI-ветку).
      POSTGRES_URL: ${{ secrets.PREVIEW_POSTGRES_URL }}
      POSTGRES_URL_NON_POOLING: ${{ secrets.PREVIEW_POSTGRES_URL_NON_POOLING }}
    steps:
      - name: Guard — требуем явное подтверждение
        if: ${{ github.event.inputs.confirm != 'seed-preview' }}
        run: |
          echo "::error::confirm != 'seed-preview' — отказ. Сид делает TRUNCATE, запуск только с подтверждением."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stride-app/package-lock.json

      # postinstall → prisma generate (без подключения к БД).
      - run: npm ci

      # Аддитивный db push на preview-ветку (3 новые колонки salesCount/minPrice/discountPct + индексы).
      - run: npx prisma db push

      # Сид: TRUNCATE + пере-создание 13 товаров; заполняет minPrice/discountPct, salesCount=0.
      - run: npm run prisma:seed
