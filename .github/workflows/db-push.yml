name: db-push

# Применить схему Prisma к Neon с Ubuntu-раннера (близко к Neon, без флака Windows→Neon / P1017).
# Запуск вручную: вкладка Actions → «db-push» → Run workflow.
# Пушит в БД из секретов POSTGRES_URL / POSTGRES_URL_NON_POOLING (те же, что у e2e).
# Чтобы нацелить на прод — временно укажи в этих секретах прод-строки ИЛИ заведи отдельные и поменяй ссылки ниже.
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: stride-app

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stride-app/package-lock.json

      # postinstall → prisma generate (без подключения к БД).
      - run: npm ci

      # Аддитивный db push (новые таблицы/FK); --accept-data-loss не нужен.
      - run: npx prisma db push
